name: CI - Microservices

on:
  push:
    branches:
      - main
      - dev
      - dev-micro-bed
      - dev-micro-appointment
      - dev-micro-eureka
      - dev-micro-gateway
      - dev-micro-hospital
      - dev-micro-ui
      - 'dev/**'
      - 'dev-*' 
    paths:
      - 'eureka-server/**'
      - 'micro-appointment/**'
      - 'micro-bed-availbility/**'
      - 'gateway/**'
      - 'micro-hospital/**'
      - 'microservice-ui/**'
      - '.github/workflows/**'

  pull_request:
    branches: [ dev, main ]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      hospital: ${{ steps.filter.outputs.hospital }}
      appointment: ${{ steps.filter.outputs.appointment }}
      bed: ${{ steps.filter.outputs.bed }}
      gateway: ${{ steps.filter.outputs.gateway }}
      eureka: ${{ steps.filter.outputs.eureka }}
      ui: ${{ steps.filter.outputs.ui }}
    steps:
      - uses: actions/checkout@v4

      - name: Filter changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            hospital:
              - 'micro-hospital/**'
            appointment:
              - 'micro-appointment/**'
            bed:
              - 'micro-bed-availbility/**'
            gateway:
              - 'gateway/**'
            eureka:
              - 'eureka-server/**'
            ui:
              - 'microservice-ui/**'

  build-java:
    if: "!contains(github.ref_name, '-ui')"
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: micro-hospital
            branch_keyword: 'hospital'
          - service: micro-appointment
            branch_keyword: 'appointment'
          - service: micro-bed-availbility
            branch_keyword: 'bed'
          - service: gateway
            branch_keyword: 'gateway'
          - service: eureka-server
            branch_keyword: 'eureka'

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 22
        if: "github.ref_name == 'main' || github.ref_name == 'dev' || contains(github.ref_name, matrix.branch_keyword)"
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build & Test ${{ matrix.service }}
        if: "github.ref_name == 'main' || github.ref_name == 'dev' || contains(github.ref_name, matrix.branch_keyword)"
        working-directory: ./${{ matrix.service }}
        run: mvn clean verify --no-transfer-progress

  build-angular:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: needs.detect-changes.outputs.ui == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: Install & Build Angular
        working-directory: ./microservice-ui/microservice-ui
        run: |
          npm ci
          npm run build --prod