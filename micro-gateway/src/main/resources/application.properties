spring.application.name=micro-gateway

server.port=8100
spring.main.web-application-type=reactive
#logging.level.org.springframework=DEBUG

logging.level.org.springframework.cloud.gateway=DEBUG
#logging.level.reactor.netty.http.server=DEBUG
#logging.level.org.springframework.security=DEBUG
#logging.level.org.springframework.security.core.userdetails=DEBUG

################### Eureka Configuration ##########################
eureka.client.serviceUrl.defaultZone: http://localhost:9102/eureka/

################### Security Configuration ##########################
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.timeout=1m
server.reactive.session.timeout=1m

# Route pour le service "Patient Centric"
spring.cloud.gateway.routes[1].id=MicroServicePatientCentric
spring.cloud.gateway.routes[1].uri=http://localhost:4100
spring.cloud.gateway.routes[1].predicates[0]=Path=/Patient/**

# Route pour le service "Hospital"
spring.cloud.gateway.routes[2].id=MicroserviceHospital
spring.cloud.gateway.routes[2].uri=http://localhost:4200
spring.cloud.gateway.routes[2].predicates[0]=Path=/Hospital/**

# Route pour le service "Bed Availability"
spring.cloud.gateway.routes[3].id=MicroserviceBedAvailability
spring.cloud.gateway.routes[3].uri=http://localhost:4300
spring.cloud.gateway.routes[3].predicates[0]=Path=/Bed/**


