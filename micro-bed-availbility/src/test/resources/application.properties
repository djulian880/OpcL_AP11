# ?? Désactivation de l'autoconfiguration JPA/Datasource ???????????????????
# Ce microservice n'a pas de base de données propre (il consomme des APIs
# via Feign). Spring Boot tente quand même d'autoconfigurer JPA si
# spring-data-jpa est dans le classpath. On l'exclut explicitement.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration

# ?? Feign ?????????????????????????????????????????????????????????????????
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# URL du gateway : surchargée par @DynamicPropertySource dans les tests IT.
# Cette valeur fallback est utilisée par les tests unitaires qui mockent Feign.
feign.client.url.microservice-gateway=http://localhost:9999

://level.com.openclassrooms=DEBUG
logging.level.feign=DEBUG