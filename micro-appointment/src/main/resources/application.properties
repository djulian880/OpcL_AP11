spring.application.name=microservice-appointment
server.port=4100

# application.properties
#eureka.client.enabled=false
eureka.client.serviceUrl.defaultZone: http://localhost:9102/eureka/
# ====================== DATASOURCE MySQL ======================
#spring.sql.init.mode=always
#spring.jpa.defer-datasource-initialization=true

spring.datasource.url=jdbc:mysql://localhost:3306/opcl_p11_appointment?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=archi_p11
spring.datasource.password=Openclassrooms2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================== JPA / HIBERNATE ======================
# Mode de creation/mise a jour automatique des tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Afficher les requetes SQL dans la console
spring.jpa.show-sql=true

# Formater joliment les requetes SQL
spring.jpa.properties.hibernate.format_sql=true

# Dialecte MySQL (Spring Boot le detecte souvent tout seul, mais c'est plus explicite)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.template.exchange=app.exchange
spring.rabbitmq.template.routing-key=appointment.events